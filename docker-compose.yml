services:
  db:
    image: mysql:8
    container_name: lancenterhd-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lancenterhd
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build:
      context: ./lancenterhd
    container_name: lancenterhd-app
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  mysql_data: