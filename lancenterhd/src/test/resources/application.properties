# Base de datos en memoria para las pruebas.
#
# No depende de que haya MySQL instalado ni de que Docker este corriendo,
# asi la suite completa puede ejecutarse en cualquier maquina y tambien en
# el pipeline de integracion continua.
spring.datasource.url=jdbc:h2:mem:lancenterhd_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Las tablas se crean al iniciar la prueba y se descartan al terminar.
spring.jpa.hibernate.ddl-auto=create-drop
