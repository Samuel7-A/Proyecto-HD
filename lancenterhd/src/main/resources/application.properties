spring.application.name=lancenterhd

# Conexion a MySQL.
# En Docker, docker-compose sobrescribe estos valores con las variables
# SPRING_DATASOURCE_*, porque las variables de entorno tienen prioridad
# sobre este archivo. Los valores de aqui son el respaldo para ejecutar
# la aplicacion fuera de contenedores.
spring.datasource.url=jdbc:mysql://localhost:3306/lancenterhd?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=lancenter
spring.datasource.password=lancenter
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate crea y actualiza las tablas a partir de las entidades anotadas.
# Sin esta linea la aplicacion arranca, pero las tablas no existen y toda
# consulta a la base falla.
spring.jpa.hibernate.ddl-auto=update
