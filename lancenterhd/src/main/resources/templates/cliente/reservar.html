<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar maquina - LanReserve</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container my-5">
    <h1 class="mb-4">Reservar maquina</h1>

    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <h5 class="card-title" th:text="${maquina.codigo}">M-01</h5>
            <p class="card-text mb-0" th:text="${maquina.especificaciones}">PC Gamer</p>
            <span class="badge bg-secondary" th:text="${maquina.estado}">DISPONIBLE</span>
        </div>
    </div>

    <form th:action="@{/cliente/reservar}" method="post" class="row g-3">
        <input type="hidden" name="maquinaId" th:value="${maquina.id}">

        <div class="col-md-6">
            <label for="celular" class="form-label">Tu celular</label>
            <input type="tel" id="celular" name="celular" class="form-control" required>
            <div class="form-text">Con el que te registraste.</div>
        </div>

        <div class="col-md-6">
            <label for="fecha" class="form-label">Fecha</label>
            <input type="date" id="fecha" name="fecha" class="form-control" required>
        </div>

        <div class="col-md-6">
            <label for="horaInicio" class="form-label">Hora de inicio</label>
            <input type="time" id="horaInicio" name="horaInicio" class="form-control" required>
        </div>

        <div class="col-md-6">
            <label for="horaFin" class="form-label">Hora de fin</label>
            <input type="time" id="horaFin" name="horaFin" class="form-control" required>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-success">Confirmar reserva</button>
            <a th:href="@{/cliente/disponibilidad}" class="btn btn-outline-secondary">Volver</a>
        </div>
    </form>
</div>

</body>
</html>
