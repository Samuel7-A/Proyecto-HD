<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Disponibilidad - LAN Center HD</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <div class="container my-5">
        <h1 class="mb-4 text-center">Consultar Disponibilidad de Máquinas</h1>

        <!-- Formulario de filtro de fecha y bloque horario (horaInicio) -->
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <form th:action="@{/cliente/disponibilidad}" method="get" class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label for="fecha" class="form-label font-weight-bold">Fecha:</label>
                        <input type="date" id="fecha" name="fecha" class="form-control" th:value="${fechaSeleccionada}" required>
                    </div>
                    <div class="col-md-4">
                        <label for="horaInicio" class="form-label font-weight-bold">Hora de Inicio (Bloque 1h):</label>
                        <input type="time" id="horaInicio" name="horaInicio" class="form-control" th:value="${horaInicioSeleccionada}" required>
                    </div>
                    <div class="col-md-4">
                        <button type="submit" class="btn btn-primary w-100">Consultar Disponibilidad</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabla de máquinas y estado -->
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h5 class="card-title mb-0">Estado de Equipos</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Código Máquina</th>
                                <th>Especificaciones / Zona</th>
                                <th>Estado</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Iteración Thymeleaf sobre la lista de máquinas -->
                            <tr th:each="maquina : ${maquinas}">
                                <td th:text="${maquina.codigo}">M-01</td>
                                <td th:text="${maquina.especificaciones}">PC Gamer High-End - Zona VIP</td>
                                <td>
                                    <!-- Evaluación de estado según LanReserve_documento.md -->
                                    <span th:if="${maquina.estado == 'DISPONIBLE'}" class="badge bg-success">Disponible</span>
                                    <span th:if="${maquina.estado == 'OCUPADA'}" class="badge bg-danger">Ocupada</span>
                                    <span th:if="${maquina.estado == 'MANTENIMIENTO'}" class="badge bg-warning text-dark">Mantenimiento</span>
                                </td>
                                <td>
                                    <a th:if="${maquina.estado == 'DISPONIBLE'}" 
                                       th:href="@{/cliente/reservar(maquinaId=${maquina.id})}" 
                                       class="btn btn-sm btn-outline-success">Reservar</a>
                                    <button th:unless="${maquina.estado == 'DISPONIBLE'}" 
                                            class="btn btn-sm btn-secondary" disabled>No disponible</button>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(maquinas)}">
                                <td colspan="4" class="text-center text-muted py-3">
                                    Selecciona una fecha y hora de inicio para consultar los equipos disponibles.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
