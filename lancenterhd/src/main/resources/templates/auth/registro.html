<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - LanReserve</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container my-5" style="max-width: 520px;">
    <h1 class="h3 mb-4 text-center">Crear cuenta</h1>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/auth/registro}" method="post">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Correo</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="celular" class="form-label">Celular</label>
                    <input type="tel" id="celular" name="celular" class="form-control"
                           pattern="[0-9]{9}" placeholder="9 digitos" required>
                    <div class="form-text">Con este numero te identificamos si vienes al local.</div>
                </div>
                <div class="mb-3">
                    <label for="clave" class="form-label">Contrasena</label>
                    <input type="password" id="clave" name="clave" class="form-control" minlength="6" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Registrarme</button>
            </form>
        </div>
    </div>

    <p class="text-center mt-3">
        Ya tienes cuenta?
        <a th:href="@{/auth/login}">Inicia sesion</a>
    </p>
</div>

</body>
</html>
